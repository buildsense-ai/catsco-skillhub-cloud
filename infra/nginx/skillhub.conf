server {
    listen 80;
    listen [::]:80;
    server_name skillhub.catsco.fun;

    return 301 https://$host:19990$request_uri;
}

server {
    listen 19990 ssl;
    listen [::]:19990 ssl;
    server_name skillhub.catsco.fun;

    ssl_certificate /etc/letsencrypt/live/skillhub.catsco.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skillhub.catsco.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SkillHubSSL:10m;
    ssl_session_tickets off;

    client_max_body_size 60m;

    access_log /var/log/nginx/catsco-skillhub.access.log;
    error_log  /var/log/nginx/catsco-skillhub.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ /\. {
        deny all;
    }

    location /packages/ {
        # Package URLs are ACL-protected by the Node API. Never serve this
        # location directly from the filesystem, otherwise a private/shared
        # package can bypass the viewer check with its old URL.
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 19990;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 19990;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
