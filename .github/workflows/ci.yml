name: SkillHub CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skillhub
          POSTGRES_PASSWORD: skillhub
          POSTGRES_DB: skillhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillhub -d skillhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SKILLHUB_DATABASE_URL: postgresql://skillhub:skillhub@127.0.0.1:5432/skillhub_test
      SKILLHUB_TEST_DATABASE_URL: postgresql://skillhub:skillhub@127.0.0.1:5432/skillhub_test

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        # Match the production installer, including native optional binaries.
        run: npm ci --ignore-scripts

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Run integration tests
        run: npm run test:ci

  publication-peer-contract:
    name: Cloud and CatsCo publication peer HTTPS contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skillhub
          POSTGRES_PASSWORD: skillhub
          POSTGRES_DB: skillhub_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillhub -d skillhub_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SKILLHUB_DATABASE_URL: postgresql://skillhub:skillhub@127.0.0.1:5432/skillhub_contract
      SKILLHUB_TEST_DATABASE_URL: postgresql://skillhub:skillhub@127.0.0.1:5432/skillhub_contract
    steps:
      - uses: actions/checkout@v4
        with:
          path: skillhub
      - uses: actions/checkout@v4
        with:
          repository: buildsense-ai/cats-company
          # PR659 merge: authenticated introspection and historical receipts.
          ref: a82f91f0e3ca6d3f9480b7682b1a7ef567fbc5ae
          path: cats-company
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skillhub/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: cats-company/go.mod
          cache-dependency-path: cats-company/go.sum
      - name: Install locked dependencies
        working-directory: skillhub
        run: npm ci --ignore-scripts
      - name: Run real peer handler and client contract
        # The renewal contract must execute against real Cloud PostgreSQL.
        working-directory: skillhub
        env:
          CATSCO_CONTRACT_ROOT: ../cats-company
          CATSCO_CONTRACT_REVISION: a82f91f0e3ca6d3f9480b7682b1a7ef567fbc5ae
        run: |
          npm run db:migrate
          npm run test:publication-peer-contract

  cancellation-recovery-contract:
    name: CatsCo and Cloud durable cancellation recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cancellation_contract
          POSTGRES_USER: contract
          POSTGRES_PASSWORD: contract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contract -d cancellation_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CATS_PG_TEST_DSN: postgres://contract:contract_test@127.0.0.1:5432/cancellation_contract?sslmode=disable
      SKILLHUB_DATABASE_URL: postgres://contract:contract_test@127.0.0.1:5432/cancellation_contract?sslmode=disable
      CATSCO_REQUIRE_CANCELLATION_CONTRACT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: skillhub
      - uses: actions/checkout@v4
        with:
          repository: buildsense-ai/cats-company
          # PR665 merge includes the reviewed PR662 cancellation sender.
          ref: 8d76e71869a4edca60b4cc1fab323a82cd7e82c3
          path: cats-company
      - uses: actions/setup-go@v5
        with:
          go-version-file: cats-company/go.mod
          cache-dependency-path: cats-company/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skillhub/package-lock.json
      - name: Prepare isolated Cloud database
        working-directory: skillhub
        run: |
          npm ci --ignore-scripts
          npm run db:migrate
      - name: Test actual sender and peer with lost response
        working-directory: cats-company
        env:
          SKILLHUB_CONTROL_CONTRACT_ROOT: ${{ github.workspace }}/skillhub
        run: go test -race ./server -run '^TestSkillHubPublicationCancellationCloudContract$' -count=1 -v -timeout 3m

  commit-permit-recovery-contract:
    name: CatsCo and Cloud commit permit recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: permit_contract
          POSTGRES_USER: contract
          POSTGRES_PASSWORD: contract_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contract -d permit_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CATS_PG_TEST_DSN: postgres://contract:contract_test@127.0.0.1:5432/permit_contract?sslmode=disable
      CATSCO_REQUIRE_COMMIT_CONTRACT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: skillhub
      - uses: actions/checkout@v4
        with:
          repository: buildsense-ai/cats-company
          # Candidate under colleague review, NOT represented as merged main.
          ref: 2249a15f82fc4cc1e946e3ecded715827592ec79
          path: cats-company
      - uses: actions/setup-go@v5
        with:
          go-version-file: cats-company/go.mod
          cache-dependency-path: cats-company/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skillhub/package-lock.json
      - name: Install locked Cloud dependencies
        working-directory: skillhub
        run: npm ci --ignore-scripts
      - name: Recover actual permit after lost HTTPS reply
        working-directory: cats-company
        env:
          SKILLHUB_COMMIT_CONTRACT_ROOT: ${{ github.workspace }}/skillhub
        run: go test -race ./server -run '^TestSkillHubPublicationCommitCloudContract$' -count=1 -v -timeout 3m

  deploy-production:
    name: Deploy production
    needs: [test, publication-peer-contract, cancellation-recovery-contract, commit-permit-recovery-contract]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: catsco-skillhub-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.SKILLHUB_PROD_HOST }}
      DEPLOY_PORT: ${{ vars.SKILLHUB_PROD_PORT }}
      DEPLOY_USER: ${{ vars.SKILLHUB_PROD_USER }}
      PUBLIC_BASE_URL: ${{ vars.SKILLHUB_PROD_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SKILLHUB_PROD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SKILLHUB_PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          test -n "$PUBLIC_BASE_URL"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

      - name: Build immutable source artifact
        run: |
          set -euo pipefail
          artifact="skillhub-${GITHUB_SHA}.tar.gz"
          git archive --format=tar.gz --output="$artifact" HEAD
          sha256sum "$artifact" > "${artifact}.sha256"

      - name: Configure pinned SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SKILLHUB_PROD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SKILLHUB_PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/skillhub_deploy"
          chmod 600 "$HOME/.ssh/skillhub_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload release artifact
        run: |
          set -euo pipefail
          artifact="skillhub-${GITHUB_SHA}.tar.gz"
          scp \
            -P "$DEPLOY_PORT" \
            -i "$HOME/.ssh/skillhub_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$artifact" "${artifact}.sha256" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/catsco/skillhub/shared/staging/"

      - name: Deploy with health check and rollback
        run: |
          set -euo pipefail
          ssh \
            -p "$DEPLOY_PORT" \
            -i "$HOME/.ssh/skillhub_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo /usr/local/sbin/deploy-catsco-skillhub '${GITHUB_SHA}'"

      - name: Verify public endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 10 --retry-max-time 90 \
            --retry 10 --retry-all-errors --retry-delay 3 \
            "${PUBLIC_BASE_URL%/}/healthz"
          curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 10 --retry-max-time 90 \
            --retry 10 --retry-all-errors --retry-delay 3 \
            "${PUBLIC_BASE_URL%/}/readyz"

      - name: Remove runner SSH material
        if: always()
        run: rm -f "$HOME/.ssh/skillhub_deploy"
