name: Description release commit paired contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  description-commit-paired:
    name: Real Cloud PostgreSQL and CatsCo description commit admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commit
          POSTGRES_PASSWORD: commit_test
          POSTGRES_DB: commit_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commit -d commit_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SKILLHUB_DATABASE_URL: postgres://commit:commit_test@127.0.0.1:5432/commit_contract
      SKILLHUB_TEST_DATABASE_URL: postgres://commit:commit_test@127.0.0.1:5432/commit_contract
    steps:
      - name: Checkout pinned Cloud admission implementation
        uses: actions/checkout@v4
        with:
          ref: 18c7dbac8b83fac9bea6600d7f332ed319b78691
          path: skillhub
      - name: Checkout paired CatsCo consumer
        uses: actions/checkout@v4
        with:
          repository: buildsense-ai/cats-company
          ref: 98c2c4f7
          path: cats-company
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skillhub/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: cats-company/go.mod
          cache-dependency-path: cats-company/go.sum
      - name: Install pinned Cloud dependencies
        working-directory: skillhub
        run: npm ci --ignore-scripts --prefer-offline --no-audit --fund=false
      - name: Apply database migrations
        working-directory: skillhub
        run: npm run db:migrate
      - name: Require the real commit admission contract
        working-directory: cats-company
        env:
          SKILLHUB_REPO: ../skillhub
        run: node scripts/test-publication-description-commit-paired.mjs
